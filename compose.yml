services:
  db:
    image: postgres:16
    container_name: publish-management-db
    environment:
      POSTGRES_DB: publishdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"

  app:
    image: yigitsancar/publish-management-pro2:latest
    container_name: publish-management-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/publishdb?sslmode=disable
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "80:8080"
