apiVersion: apps/v1
kind: Deployment
metadata:
  name: publish-management-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: publish-management-app
  template:
    metadata:
      labels:
        app: publish-management-app
    spec:
      containers:
        - name: publish-management-app
          image: yigitsancar/publish-management-pro2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/publishdb?sslmode=disable
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
---
apiVersion: v1
kind: Service
metadata:
  name: publish-management-service
spec:
  selector:
    app: publish-management-app
  ports:
    - port: 8080
      targetPort: 8080
